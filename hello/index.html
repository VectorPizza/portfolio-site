<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Austin Remer — Designer</title>
<link rel="canonical" href="https://austinremer.com/">
<style>html{background:#1a1917;color-scheme:dark}</style>
<script>
// Resume link: record one visit at /hello in GoatCounter, then go to the homepage.
(function () {
  var u = 'https://arportfolio.goatcounter.com/count?p=' + encodeURIComponent('/hello') +
    '&t=' + encodeURIComponent('Resume link') +
    '&r=' + encodeURIComponent(document.referrer || '') +
    '&q=' + encodeURIComponent(location.search) +
    '&s=' + screen.width + ',' + screen.height + ',' + (window.devicePixelRatio || 1) +
    (navigator.webdriver ? '&b=153' : '') +
    '&rnd=' + Math.random().toString(36).slice(2);
  try { fetch(u, { mode: 'no-cors', keepalive: true, credentials: 'omit' }); } catch (e) { new Image().src = u; }
  setTimeout(function () { location.replace('/'); }, 150);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body>
<noscript><img src="https://arportfolio.goatcounter.com/count?p=/hello&amp;t=Resume%20link" alt="" width="1" height="1"></noscript>
<a href="/" style="color:#d4d2cc;font:17px system-ui;position:absolute;left:24px;top:24px">austinremer.com</a>
</body>
</html>
